<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8"/>
    <title>PDN Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/binat-login.css') }}">
</head>
<body>
<!-- Theme toggle -->
<button class="theme-toggle" onclick="toggleTheme()" title="החלף ערכת נושא" aria-label="החלף ערכת נושא">
    <i class="fas fa-moon"></i>
</button>

<!-- Header -->
<header class="header-gradient">
    <div class="header-content">
        <div class="header-left">
            <a href="https://www.pdn.co.il" target="_blank" class="logo-link">
                <img src="{{ url_for('static', filename='images/pdn_logo.png') }}" alt="PDN Logo" class="header-logo"/>
            </a>
            <div class="header-text">
                <h1 class="header-title">PDN Center</h1>
                <p class="header-subtitle">מערכת שליטה וניהול</p>
            </div>
        </div>
    </div>
</header>

<!-- Main container -->
<div class="container mx-auto p-6 max-w-4xl">
    <div class="login-container">
        <div class="text-center mb-8">
            <h2 class="login-heading">ברוך הבא למערכת הניהול</h2>
            <p class="login-subheading">הזן סיסמה כדי להתחבר</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div class="form-group">
                <label for="email" class="form-label">
                    <i class="fas fa-envelope"></i>
                    אימייל
                </label>
                <input type="email" id="email" name="email" required
                       class="form-input"
                       placeholder="הזן כתובת אימייל"
                       autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">
                    <i class="fas fa-lock"></i>
                    סיסמה
                </label>
                <div style="position:relative;">
                    <input type="password" id="password" name="password" required
                           class="form-input"
                           placeholder="הזן סיסמה"
                           autocomplete="current-password"
                           maxlength="50"
                           style="padding-left:40px;">
                    <button type="button"
                            onclick="togglePassword()"
                            tabindex="-1"
                            title="הצג/הסתר סיסמה"
                            style="position:absolute;left:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#94a3b8;font-size:16px;padding:0;line-height:1;">
                        <i id="eyeIcon" class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="submit-button">
                <i class="fas fa-sign-in-alt"></i>
                כניסה למערכת
            </button>
        </form>

        <div id="loginError" class="error-message">
            <i class="fas fa-exclamation-triangle mr-2"></i>
            <span>סיסמה שגויה</span>
        </div>

        <!-- Footer -->
        {% include 'partials/footer.html' %}
    </div>
</div>

<script>
    let isDarkMode = false;
    let sessionToken = null;

    // Theme toggle with proper state management
    function toggleTheme() {
        isDarkMode = !isDarkMode;
        document.documentElement.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');

        const themeIcon = document.querySelector('.theme-toggle i');
        themeIcon.className = isDarkMode ? 'fas fa-sun' : 'fas fa-moon';

        // Save preference
        localStorage.setItem('darkMode', isDarkMode);
    }

    // Toggle password visibility
    function togglePassword() {
        const input = document.getElementById('password');
        const icon  = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fas fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fas fa-eye';
        }
    }

    // Function to show error message
    function showError(message) {
        const loginError = document.getElementById('loginError');
        loginError.querySelector('span').textContent = message;
        loginError.style.display = 'block';
    }

    // Function to hide error message
    function hideError() {
        const loginError = document.getElementById('loginError');
        loginError.style.display = 'none';
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', function () {
        setupEventListeners();

        // Load theme preference
        const savedTheme = localStorage.getItem('darkMode');
        if (savedTheme === 'true') {
            isDarkMode = true;
            document.documentElement.setAttribute('data-theme', 'dark');
            const themeIcon = document.querySelector('.theme-toggle i');
            themeIcon.className = 'fas fa-sun';
        }
    });

    function setupEventListeners() {
        // Login form
        document.getElementById('loginForm').addEventListener('submit', handleLogin);

        // Hide error when user starts typing
        document.getElementById('password').addEventListener('input', function () {
            hideError();
        });
    }

    async function handleLogin(e) {
        e.preventDefault();
        showLoading();

        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/pdn-admin/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({email: document.getElementById('email').value, password: password})
            });

            if (response.ok) {
                const data = await response.json();
                sessionToken = data.session_token;
                // Store session token and email in localStorage
                localStorage.setItem('adminSessionToken', sessionToken);
                localStorage.setItem('adminEmail', document.getElementById('email').value.toLowerCase());
                // Redirect to dashboard
                await new Promise(resolve => setTimeout(resolve, 100));
                window.location.href = '/pdn-admin/dashboard';
            } else {
                throw new Error('Invalid credentials');
            }
        } catch (error) {
            showError('סיסמה שגויה');
        } finally {
            hideLoading();
        }
    }

    function showLoading() {
        const button = document.querySelector('.submit-button');
        button.classList.add('loading');
        button.disabled = true;
    }

    function hideLoading() {
        const button = document.querySelector('.submit-button');
        button.classList.remove('loading');
        button.disabled = false;
    }

    // Handle Enter key press
    document.getElementById('password').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        }
    });
</script>
</body>
</html>
